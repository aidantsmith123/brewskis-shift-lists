<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brewskis Shift Lists</title>
<meta name="description" content="Shift checklists, inventory counts and order deadlines for JT Brewski's Pub.">
<meta name="theme-color" content="#2a170b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brewskis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- the intro plays once each time the app is opened, not on refreshes or updates -->
<script>try{if(sessionStorage.getItem("brewskis.intro"))document.documentElement.classList.add("no-intro")}catch(e){}</script>
</head>
<body>
<div id="intro" class="intro" aria-hidden="true">
  <div class="intro-pour"></div>
  <div class="intro-center">
    <div class="logo intro-logo"></div>
    <div class="intro-title">Shift Lists</div>
  </div>
</div>
<header class="band">
  <div class="wrap top">
    <div class="brand">
      <div class="logo" role="img" aria-label="JT Brewski's Pub logo"></div>
      <div>
        <div class="kicker">JT Brewski's Pub</div>
        <h1>Shift Lists</h1>
      </div>
    </div>
    <div class="topright">
      <button class="installbtn" id="installBtn" type="button" hidden>Install</button>
      <button class="who" id="whoBtn" type="button" hidden><span class="dot" id="whoDot">?</span><span id="whoName"></span></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="offline" id="offline" role="status" hidden></div>
  <div class="updatebar" id="updatebar" role="status" hidden><span id="updatetext"></span><button type="button" class="btn small" id="updateBtn">Update now</button></div>
  <div class="shiftday"><span id="dayLabel"></span><span>Daily tasks reset at 5 AM</span></div>
  <nav class="tabs" id="tabs" hidden>
    <button type="button" id="tabShifts" aria-pressed="true">Shifts</button>
    <button type="button" id="tabInv" aria-pressed="false">Inventory</button>
    <button type="button" id="tabTeam" aria-pressed="false" hidden>Team</button>
  </nav>
  <main id="view"><p class="hint">Loading…</p></main>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<noscript><p style="padding:16px">Turn on JavaScript to use Brewskis Shift Lists.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
