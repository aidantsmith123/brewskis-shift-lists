<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JT Brewski's Pub</title>
<meta name="description" content="Shift checklists, inventory counts and order deadlines for JT Brewski's Pub.">
<meta name="theme-color" content="#2a170b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brewskis">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- the intro plays once each time the app is opened, not on refreshes or updates -->
<script>try{if(sessionStorage.getItem("brewskis.intro"))document.documentElement.classList.add("no-intro")}catch(e){}</script>
<!-- light or dark, if this phone picked one in Settings (otherwise it follows the phone) -->
<script>try{var t=localStorage.getItem("brewskis.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div id="intro" class="intro" aria-hidden="true">
  <div class="intro-pour"></div>
  <div class="intro-center">
    <div class="logo intro-logo"></div>
  </div>
</div>
<header class="band">
  <div class="wrap top">
    <h1 class="sr-only">JT Brewski's staff app</h1>
    <div class="topleft">
      <button class="gearbtn" id="settingsBtn" type="button" aria-label="Settings" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div class="logo toplogo" role="img" aria-label="JT Brewski's Pub logo"></div>
    <div class="topright">
      <button class="installbtn" id="installBtn" type="button" hidden>Install</button>
      <button class="who" id="whoBtn" type="button" hidden><span class="dot" id="whoDot">?</span><span id="whoName"></span></button>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="offline" id="offline" role="status" hidden></div>
  <div class="updatebar" id="updatebar" role="status" hidden><span id="updatetext"></span><button type="button" class="btn small" id="updateBtn">Update now</button></div>
  <div class="shiftday"><span id="dayLabel"></span><span>Days roll over at 5 AM</span></div>
  <nav class="tabs" id="tabs" hidden>
    <button type="button" id="tabShifts" aria-pressed="true">Tasks</button>
    <button type="button" id="tabInv" aria-pressed="false">Inventory</button>
    <button type="button" id="tabSched" aria-pressed="false">Shifts</button>
    <button type="button" id="tabEvents" aria-pressed="false">Events</button>
  </nav>
  <main id="view"><p class="hint">Loading…</p></main>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<noscript><p style="padding:16px">Turn on JavaScript to use the JT Brewski's staff app.</p></noscript>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
